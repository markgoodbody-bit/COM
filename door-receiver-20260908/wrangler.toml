name = "psfh-receiver-local-review"
compatibility_date = "2026-09-08"
pages_build_output_dir = "./public"

[vars]
SYNTHETIC_ONLY = "true"
APP_ORIGIN = "http://127.0.0.1:8788"

[[d1_databases]]
binding = "DB"
database_name = "psfh-receiver-local-review"
# Deliberately not a real remote database. Local-only review configuration.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
