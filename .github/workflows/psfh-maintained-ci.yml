name: PSFH maintained CI

on:
  push:
    branches:
      - codex/door-maintained-source-20260908
      - 'framework/psfh-*'
  pull_request:
    branches:
      - codex/door-maintained-source-20260908

permissions:
  contents: read

jobs:
  public-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install pypdf
      - name: Build public site
        run: npm run build
      - name: Resource, currentness and entrance regressions
        run: node --test scripts/test-resources.mjs scripts/test-discovery.mjs scripts/test-primary-routes.mjs scripts/test-opening-copy.mjs scripts/test-works-current.mjs scripts/test-contextual-art.mjs scripts/test-reading-rooms-current.mjs scripts/test-appeal-example-current.mjs
      - name: Optional journey script syntax
        run: node --check public/journey.js
      - name: Resource reassembly and source-view roundtrip
        run: python -m unittest scripts.test_import_resources scripts.test_source_views
      - name: Local route integrity
        run: python scripts/check-local-links.py

# This workflow checks source/build integrity only.
# CI_PASS != READER_BENEFIT != VALIDATION != PUBLICATION
