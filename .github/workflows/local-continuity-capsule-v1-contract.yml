name: local-continuity-capsule-v1-contract

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'research/LOCAL_CONTINUITY_CAPSULE_V1_SCHEMA_20260902.json'
      - 'research/LOCAL_CONTINUITY_CAPSULE_V1_PROFILE_20260902.json'
      - 'research/LOCAL_CONTINUITY_CAPSULE_V1_FIXTURES_20260903.json'
      - 'research/validate_local_continuity_capsule_v1_contract.py'
      - '.github/workflows/local-continuity-capsule-v1-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Draft 2020-12 validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate exact capsule v1 contract binding and semantics
        run: python research/validate_local_continuity_capsule_v1_contract.py
