name: PSFH D083 publish appeal case family

on:
  push:
    branches:
      - framework/psfh-d083-publish-20260923
    paths:
      - '.github/workflows/psfh-d083-publish.yml'

permissions:
  contents: write

jobs:
  publish-d083:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framework/psfh-d083-publish-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Build and check D083
        run: |
          npm run build
          node --test scripts/test-resources.mjs scripts/test-discovery.mjs scripts/test-primary-routes.mjs scripts/test-opening-copy.mjs scripts/test-works-current.mjs scripts/test-contextual-art.mjs scripts/test-reading-rooms-current.mjs scripts/test-appeal-example-current.mjs
          node --check public/journey.js
          python -m unittest scripts.test_import_resources scripts.test_source_views
          python scripts/check-local-links.py
          python scripts/check-visible-routes.py
          git diff --check
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const manifest=JSON.parse(await readFile('out/manifest.json','utf8'));
          if(manifest.site_edition!=='0.8.40') throw Error('D083 site edition missing');
          if(!manifest.provenance?.appeal_case_family_d083) throw Error('D083 provenance missing');
          for (const name of ['entry','case','route','affected','challenge']) {
            const html=await readFile('out/explore/example/'+name+'.html','utf8');
            if(!html.includes('class="case-example"') || !html.includes('class="case-example-page"')) throw Error('case-family shell missing: '+name);
            if(/<style>|style="/.test(html)) throw Error('old example inline style survived: '+name);
          }
          NODE
      - name: Verify publication base
        env:
          EXPECTED_GH_PAGES: 9379c14c7c530313eb45a726c024c12af4da821e
        run: |
          git fetch origin gh-pages
          actual="$(git rev-parse origin/gh-pages)"
          test "$actual" = "$EXPECTED_GH_PAGES" || {
            echo "gh-pages moved: expected $EXPECTED_GH_PAGES, got $actual" >&2
            exit 1
          }
      - name: Stage exact built site over D082
        run: |
          rm -rf /tmp/psfh-d083-publish
          git worktree add -B gh-pages /tmp/psfh-d083-publish origin/gh-pages
          cname_blob="$(git -C /tmp/psfh-d083-publish hash-object CNAME)"
          nojekyll_blob="$(git -C /tmp/psfh-d083-publish hash-object .nojekyll)"
          attrs_blob="$(git -C /tmp/psfh-d083-publish hash-object .gitattributes)"
          readme_blob="$(git -C /tmp/psfh-d083-publish hash-object README.md)"
          rsync -a --delete --exclude='.git' --exclude='CNAME' --exclude='.nojekyll' --exclude='.gitattributes' --exclude='/README.md' out/ /tmp/psfh-d083-publish/
          test "$(git -C /tmp/psfh-d083-publish hash-object CNAME)" = "$cname_blob"
          test "$(git -C /tmp/psfh-d083-publish hash-object .nojekyll)" = "$nojekyll_blob"
          test "$(git -C /tmp/psfh-d083-publish hash-object .gitattributes)" = "$attrs_blob"
          test "$(git -C /tmp/psfh-d083-publish hash-object README.md)" = "$readme_blob"
          node --input-type=module -e "import {verifyResources} from './scripts/resources.mjs'; await verifyResources('/tmp/psfh-d083-publish/resources');"
      - name: Commit and publish D083
        run: |
          git -C /tmp/psfh-d083-publish config user.name "PSFH release publisher"
          git -C /tmp/psfh-d083-publish config user.email "actions@users.noreply.github.com"
          git -C /tmp/psfh-d083-publish add -A
          if git -C /tmp/psfh-d083-publish diff --cached --quiet; then
            echo "No D083 publication delta" >&2
            exit 1
          fi
          git -C /tmp/psfh-d083-publish commit -m "Publish PSFH D083 appeal case family"
          git -C /tmp/psfh-d083-publish push origin HEAD:gh-pages
      - name: Verify D083 served bytes
        run: |
          declare -A paths=(
            [style]="style.css"
            [entry]="explore/example/entry.html"
            [case]="explore/example/case.html"
            [route]="explore/example/route.html"
            [affected]="explore/example/affected.html"
            [challenge]="explore/example/challenge.html"
            [manifest]="manifest.json"
            [changes]="changes.html"
          )
          ok=0
          for i in $(seq 1 18); do
            all=1
            for key in "${!paths[@]}"; do
              path="${paths[$key]}"
              expected="$(sha256sum "out/$path" | awk '{print $1}')"
              if ! curl -fsSL --max-time 20 "https://pleasestartfromhere.com/$path" -o "/tmp/psfh-d083-$key"; then all=0; continue; fi
              actual="$(sha256sum "/tmp/psfh-d083-$key" | awk '{print $1}')"
              test "$actual" = "$expected" || all=0
            done
            if [ "$all" = 1 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1 || { echo "Live D083 selected bytes did not converge" >&2; exit 1; }
          grep -F 'body.case-example { max-width: none; padding: 0; }' /tmp/psfh-d083-style
          grep -F 'class="case-example"' /tmp/psfh-d083-entry
          grep -F 'class="case-example-page"' /tmp/psfh-d083-route
          ! grep -F '<style>' /tmp/psfh-d083-challenge
          grep -F '"site_edition": "0.8.40"' /tmp/psfh-d083-manifest
          grep -F 'Make the appeal illustration read as one case family' /tmp/psfh-d083-changes
          echo "D083 selected live bytes verified"
