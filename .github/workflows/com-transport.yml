name: COM transport storage contract
on:
  push:
    paths: ['transport/**', '.github/workflows/com-transport.yml']
  pull_request:
    paths: ['transport/**', '.github/workflows/com-transport.yml']
permissions:
  contents: read
jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s transport -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test transport/test_worker.mjs
