name: PSFH D084 publish single contextual skip

on:
  push:
    branches:
      - framework/psfh-d084-publish-20260923
    paths:
      - '.github/workflows/psfh-d084-publish.yml'

permissions:
  contents: write

jobs:
  publish-d084:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framework/psfh-d084-publish-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Build and check D084
        run: |
          npm run build
          node --test scripts/test-resources.mjs scripts/test-discovery.mjs scripts/test-primary-routes.mjs scripts/test-opening-copy.mjs scripts/test-works-current.mjs scripts/test-contextual-art.mjs scripts/test-reading-rooms-current.mjs scripts/test-appeal-example-current.mjs
          node --check public/journey.js
          python -m unittest scripts.test_import_resources scripts.test_source_views
          python scripts/check-local-links.py
          python scripts/check-visible-routes.py
          git diff --check
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const manifest=JSON.parse(await readFile('out/manifest.json','utf8'));
          if(manifest.site_edition!=='0.8.41') throw Error('D084 site edition missing');
          if(!manifest.provenance?.single_contextual_skip_d084) throw Error('D084 provenance missing');
          for (const path of ['aperture','significance','hardening','futures']) {
            const html=await readFile('out/explore/nodes/'+path+'.html','utf8');
            const skips=[...html.matchAll(/<a class="skip"[^>]*href="([^"]+)"[^>]*>([^<]+)<\/a>/g)];
            if(skips.length!==1 || skips[0][1]!=='#reading') throw Error('contextual skip invariant missing: '+path);
          }
          const change=await readFile('out/explore/nodes/change.html','utf8');
          if((change.match(/class="skip"/g)||[]).length!==1 || !change.includes('href="#question"')) throw Error('text-only skip changed');
          const explore=await readFile('out/explore/index.html','utf8');
          if((explore.match(/class="skip"/g)||[]).length!==1 || !explore.includes('href="#reading-map"')) throw Error('Explore skip changed');
          NODE
      - name: Verify publication base
        env:
          EXPECTED_GH_PAGES: 6b8aa57dea37a595f1bff014ec1d734a56501650
        run: |
          git fetch origin gh-pages
          actual="$(git rev-parse origin/gh-pages)"
          test "$actual" = "$EXPECTED_GH_PAGES" || {
            echo "gh-pages moved: expected $EXPECTED_GH_PAGES, got $actual" >&2
            exit 1
          }
      - name: Stage exact built site over D083
        run: |
          rm -rf /tmp/psfh-d084-publish
          git worktree add -B gh-pages /tmp/psfh-d084-publish origin/gh-pages
          cname_blob="$(git -C /tmp/psfh-d084-publish hash-object CNAME)"
          nojekyll_blob="$(git -C /tmp/psfh-d084-publish hash-object .nojekyll)"
          attrs_blob="$(git -C /tmp/psfh-d084-publish hash-object .gitattributes)"
          readme_blob="$(git -C /tmp/psfh-d084-publish hash-object README.md)"
          rsync -a --delete --exclude='.git' --exclude='CNAME' --exclude='.nojekyll' --exclude='.gitattributes' --exclude='/README.md' out/ /tmp/psfh-d084-publish/
          test "$(git -C /tmp/psfh-d084-publish hash-object CNAME)" = "$cname_blob"
          test "$(git -C /tmp/psfh-d084-publish hash-object .nojekyll)" = "$nojekyll_blob"
          test "$(git -C /tmp/psfh-d084-publish hash-object .gitattributes)" = "$attrs_blob"
          test "$(git -C /tmp/psfh-d084-publish hash-object README.md)" = "$readme_blob"
          node --input-type=module -e "import {verifyResources} from './scripts/resources.mjs'; await verifyResources('/tmp/psfh-d084-publish/resources');"
      - name: Commit and publish D084
        run: |
          git -C /tmp/psfh-d084-publish config user.name "PSFH release publisher"
          git -C /tmp/psfh-d084-publish config user.email "actions@users.noreply.github.com"
          git -C /tmp/psfh-d084-publish add -A
          if git -C /tmp/psfh-d084-publish diff --cached --quiet; then
            echo "No D084 publication delta" >&2
            exit 1
          fi
          git -C /tmp/psfh-d084-publish commit -m "Publish PSFH D084 single contextual skip"
          git -C /tmp/psfh-d084-publish push origin HEAD:gh-pages
      - name: Verify D084 served bytes
        run: |
          declare -A paths=(
            [aperture]="explore/nodes/aperture.html"
            [significance]="explore/nodes/significance.html"
            [hardening]="explore/nodes/hardening.html"
            [futures]="explore/nodes/futures.html"
            [change]="explore/nodes/change.html"
            [explore]="explore/index.html"
            [manifest]="manifest.json"
            [changes]="changes.html"
          )
          ok=0
          for i in $(seq 1 18); do
            all=1
            for key in "${!paths[@]}"; do
              path="${paths[$key]}"
              expected="$(sha256sum "out/$path" | awk '{print $1}')"
              if ! curl -fsSL --max-time 20 "https://pleasestartfromhere.com/$path" -o "/tmp/psfh-d084-$key"; then all=0; continue; fi
              actual="$(sha256sum "/tmp/psfh-d084-$key" | awk '{print $1}')"
              test "$actual" = "$expected" || all=0
            done
            if [ "$all" = 1 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1 || { echo "Live D084 selected bytes did not converge" >&2; exit 1; }
          test "$(grep -o 'class="skip"' /tmp/psfh-d084-aperture | wc -l)" = 1
          grep -F 'href="#reading">Go straight to the reading</a>' /tmp/psfh-d084-aperture
          test "$(grep -o 'class="skip"' /tmp/psfh-d084-change | wc -l)" = 1
          grep -F 'href="#question">Skip to the question</a>' /tmp/psfh-d084-change
          test "$(grep -o 'class="skip"' /tmp/psfh-d084-explore | wc -l)" = 1
          grep -F 'href="#reading-map">Go straight to the map</a>' /tmp/psfh-d084-explore
          grep -F '"site_edition": "0.8.41"' /tmp/psfh-d084-manifest
          grep -F 'Keep one accessibility bypass in art-bearing reading rooms' /tmp/psfh-d084-changes
          echo "D084 selected live bytes verified"
