name: BeforeBuild v0

on:
  pull_request:
    paths:
      - 'experiments/beforebuild-v0/**'
      - '.github/workflows/beforebuild-v0.yml'
  push:
    branches:
      - 'framework/beforebuild-v0-falsifier'
    paths:
      - 'experiments/beforebuild-v0/**'
      - '.github/workflows/beforebuild-v0.yml'

permissions:
  contents: read

jobs:
  decision-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile experiments/beforebuild-v0/beforebuild.py experiments/beforebuild-v0/test_beforebuild.py
      - name: Unit and steering tests
        run: python -m unittest experiments/beforebuild-v0/test_beforebuild.py -v
      - name: Historical calibration smoke
        run: |
          python experiments/beforebuild-v0/beforebuild.py experiments/beforebuild-v0/calibration_cases.json --out /tmp/beforebuild.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/beforebuild.json'))
          got={x['case_id']:x['verdict'] for x in r['results']}
          assert got == {
              'evidencebridge-vs-doubt': 'INTEROPERATE',
              'policy-boundary-compiler': 'STOP',
              'rail-accessibility-currentness': 'BUILD_PROBE',
          }, got
          print(json.dumps(got, indent=2, sort_keys=True))
          PY

  live-doubt-owner-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Execute pinned upstream Doubt owner on four THR hard cases
        uses: alsoleg89/doubt@647482d536e8c3fdda573699426b7dc5673f9905 # v0.8.0
        with:
          path: experiments/doubt-thr-interop-20260918
          require-maps: 'true'
      - name: Remove recorded Doubt execution and emit machine owner receipt
        run: |
          python - <<'PY'
          import json
          data=json.load(open('experiments/beforebuild-v0/calibration_cases.json'))
          case=next(c for c in data['cases'] if c['id']=='evidencebridge-vs-doubt')
          owner=next(c for c in case['candidates'] if c['id']=='doubt-v0.8.0')
          owner['trial']['executed']=False
          owner['trial']['hard_case_results']={}
          json.dump(data, open('/tmp/cases.json','w'), indent=2)

          receipt={
            'format':'beforebuild-owner-receipts-v0.1',
            'receipts':[{
              'case_id':'evidencebridge-vs-doubt',
              'candidate_id':'doubt-v0.8.0',
              'executed':True,
              'hard_case_results':{
                'flak':'PASS',
                'hannibal':'PASS',
                'r-vale':'PASS',
                'sieve-riddle':'PASS',
              },
              'source':'github-action:alsoleg89/doubt@647482d536e8c3fdda573699426b7dc5673f9905'
            }]
          }
          json.dump(receipt, open('/tmp/doubt-receipt.json','w'), indent=2)
          PY
      - name: Require owner receipt to reproduce INTEROPERATE
        run: |
          python experiments/beforebuild-v0/beforebuild.py /tmp/cases.json             --receipt /tmp/doubt-receipt.json --out /tmp/live-owner-report.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/live-owner-report.json'))
          row=next(x for x in r['results'] if x['case_id']=='evidencebridge-vs-doubt')
          assert row['verdict']=='INTEROPERATE', row
          cov=next(x for x in row['candidate_coverage'] if x['candidate_id']=='doubt-v0.8.0')
          assert cov['receipt_source'].startswith('github-action:alsoleg89/doubt@')
          print(json.dumps({'verdict':row['verdict'],'receipt_source':cov['receipt_source'],'hard_cases_passed':cov['pass'],'review_loss_ids':cov['review_loss_ids']}, indent=2))
          PY

  live-rail-owner-system-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe current National Rail public owner surfaces
        run: |
          python experiments/rail-accessibility-currentness-20260918/check.py --live --json > /tmp/rail-live.json
      - name: Convert live owner observation to BeforeBuild receipt
        run: |
          python - <<'PY'
          import json
          audits=json.load(open('/tmp/rail-live.json'))
          map_result={
            'CONTRADICTION':'FAIL',
            'CONSISTENT_EXISTS':'PASS',
            'NO_EXISTENCE_COMPARISON':'NOT_TESTED',
            'FETCH_UNKNOWN':'NOT_TESTED',
          }
          results={row['crs']:map_result[row['result']] for row in audits}
          assert set(results)=={'HIR','IRL','DSY','BIW','AGV','LLE'}, results

          data=json.load(open('experiments/beforebuild-v0/calibration_cases.json'))
          case=next(c for c in data['cases'] if c['id']=='rail-accessibility-currentness')
          owner=next(c for c in case['candidates'] if c['id']=='national-rail-owner-system')
          owner['trial']['executed']=False
          owner['trial']['hard_case_results']={}
          json.dump(data, open('/tmp/cases.json','w'), indent=2)

          receipt={
            'format':'beforebuild-owner-receipts-v0.1',
            'receipts':[{
              'case_id':'rail-accessibility-currentness',
              'candidate_id':'national-rail-owner-system',
              'executed':True,
              'hard_case_results':results,
              'source':'live-public-owner-surfaces:rail-accessibility-checker'
            }]
          }
          json.dump(receipt, open('/tmp/rail-receipt.json','w'), indent=2)
          print(json.dumps({'live_results':results}, indent=2))
          PY
      - name: Evaluate current owner state without freezing historical failure
        run: |
          python experiments/beforebuild-v0/beforebuild.py /tmp/cases.json             --receipt /tmp/rail-receipt.json --out /tmp/rail-beforebuild.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/rail-beforebuild.json'))
          row=next(x for x in r['results'] if x['case_id']=='rail-accessibility-currentness')
          assert row['verdict'] in {'BUILD_PROBE','USE_OWNER','SHRINK'}, row
          print(json.dumps({'current_verdict':row['verdict'],'coverage':row['candidate_coverage']}, indent=2))
          PY


  prospective-guestbook-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pre-existing PSFH guestbook decision without expected verdict
        run: |
          python experiments/beforebuild-v0/beforebuild.py             experiments/beforebuild-v0/prospective_guestbook.json             --out /tmp/guestbook-beforebuild.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/guestbook-beforebuild.json'))
          assert len(r['results']) == 1
          row=r['results'][0]
          print(json.dumps({
              'case_id': row['case_id'],
              'observed_verdict': row['verdict'],
              'reason': row['reason'],
              'candidate_coverage': row['candidate_coverage'],
          }, indent=2))
          PY


  remark42-guestbook-owner-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pinned Remark42 owner locally on loopback only
        env:
          REMARK_IMAGE: ghcr.io/umputun/remark42:v1.16.4@sha256:980e0e76a6f241cd181f44c5b4d686f0d8cd7f552e11deb3bdcba223b2c3b866
        run: |
          docker pull "$REMARK_IMAGE"
          docker run -d --rm --name beforebuild-remark42             -p 127.0.0.1:8080:8080             -e REMARK_URL=http://127.0.0.1:8080             -e SITE=psfh             -e SECRET=beforebuild-ephemeral-secret-not-for-production             -e AUTH_ANON=true             -e MAX_COMMENT_SIZE=280             -e ADMIN_PASSWD=beforebuild-admin             "$REMARK_IMAGE"

          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/ping >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs beforebuild-remark42
            exit 1
          fi

      - name: Exercise guestbook hard cases and emit machine owner receipt
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          base = "http://127.0.0.1:8080"
          thread = "https://psfh.invalid/guestbook"
          results = {
              "anonymous-or-account-free": "NOT_TESTED",
              "separate-trust-region": "NOT_TESTED",
              "true-removal": "NOT_TESTED",
              "export-portability": "NOT_TESTED",
              "bounded-abuse-stop": "NOT_TESTED",
              "plain-small-mark": "NOT_TESTED",
          }
          notes = {}

          def run(args, check=False):
              p = subprocess.run(args, text=True, capture_output=True)
              if check and p.returncode != 0:
                  raise RuntimeError(f"command failed: {args!r}\nstdout={p.stdout}\nstderr={p.stderr}")
              return p

          cookies = "/tmp/remark-cookies.txt"
          login = run([
              "curl", "-sS", "-o", "/tmp/remark-login-body",
              "-D", "/tmp/remark-login-headers",
              "-c", cookies,
              f"{base}/auth/anonymous/login?user=visitor&aud=psfh",
          ])
          notes["anonymous_login_curl_rc"] = login.returncode

          xsrf = ""
          cp = Path(cookies)
          if cp.exists():
              for line in cp.read_text(encoding="utf-8").splitlines():
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split("\t")
                  if len(parts) >= 7 and parts[5] == "XSRF-TOKEN":
                      xsrf = parts[6]

          def post(text, outpath):
              payload = json.dumps({
                  "text": text,
                  "locator": {"site": "psfh", "url": thread},
              })
              args = [
                  "curl", "-sS", "-o", outpath, "-w", "%{http_code}",
                  "-b", cookies,
                  "-H", "Content-Type: application/json",
              ]
              if xsrf:
                  args += ["-H", f"X-XSRF-TOKEN: {xsrf}"]
              args += ["-X", "POST", f"{base}/api/v1/comment?site=psfh", "-d", payload]
              p = run(args)
              try:
                  status = int(p.stdout.strip())
              except Exception:
                  status = 0
              return status

          first_status = post("I was here", "/tmp/remark-first.json")
          notes["first_post_status"] = first_status
          if first_status == 201:
              results["anonymous-or-account-free"] = "PASS"
              first = json.load(open("/tmp/remark-first.json"))
              comment_id = first.get("id")
              # Remark42 stores/render comments as comment objects but supplies no
              # PSFH-specific untrusted/project-instruction boundary.
              if "project_instruction" in first or "trust" in first:
                  results["separate-trust-region"] = "PASS"
              else:
                  results["separate-trust-region"] = "FAIL"

              # User-authenticated delete within the configured edit window.
              payload = json.dumps({"text": "", "summary": "remove", "delete": True})
              args = [
                  "curl", "-sS", "-o", "/tmp/remark-delete.json", "-w", "%{http_code}",
                  "-b", cookies,
                  "-H", "Content-Type: application/json",
              ]
              if xsrf:
                  args += ["-H", f"X-XSRF-TOKEN: {xsrf}"]
              args += [
                  "-X", "PUT",
                  f"{base}/api/v1/comment/{comment_id}?site=psfh&url={thread}",
                  "-d", payload,
              ]
              deleted = run(args)
              try:
                  del_status = int(deleted.stdout.strip())
              except Exception:
                  del_status = 0
              notes["self_delete_status"] = del_status

              found = run([
                  "curl", "-sS",
                  f"{base}/api/v1/find?site=psfh&url={thread}&format=plain",
              ])
              if del_status in {200, 201} and "I was here" not in found.stdout:
                  results["true-removal"] = "PASS"
              elif del_status:
                  results["true-removal"] = "FAIL"

          md_status = post("[x](https://example.com)", "/tmp/remark-markdown.json")
          notes["markdown_post_status"] = md_status
          if md_status == 201:
              md = json.load(open("/tmp/remark-markdown.json"))
              rendered = str(md.get("text", ""))
              original = str(md.get("orig", ""))
              # PSFH v0 explicitly wants no links/markdown in stored guest text.
              if "https://example.com" in original or "<a " in rendered:
                  results["plain-small-mark"] = "FAIL"
              else:
                  results["plain-small-mark"] = "PASS"

          export = run([
              "curl", "-sS", "-o", "/tmp/remark-export.bin", "-w", "%{http_code}",
              "-u", "admin:beforebuild-admin",
              f"{base}/api/v1/admin/export?site=psfh&mode=stream",
          ])
          try:
              export_status = int(export.stdout.strip())
          except Exception:
              export_status = 0
          notes["admin_export_status"] = export_status
          if export_status == 200 and Path("/tmp/remark-export.bin").stat().st_size > 0:
              results["export-portability"] = "PASS"
          elif export_status:
              results["export-portability"] = "FAIL"

          readonly = run([
              "curl", "-sS", "-o", "/tmp/remark-readonly.json", "-w", "%{http_code}",
              "-u", "admin:beforebuild-admin",
              "-X", "PUT",
              f"{base}/api/v1/admin/readonly?site=psfh&url={thread}&ro=1",
          ])
          try:
              ro_status = int(readonly.stdout.strip())
          except Exception:
              ro_status = 0
          notes["readonly_set_status"] = ro_status
          if ro_status in {200, 201}:
              blocked_status = post("should be blocked", "/tmp/remark-blocked.json")
              notes["post_after_readonly_status"] = blocked_status
              results["bounded-abuse-stop"] = "PASS" if blocked_status != 201 else "FAIL"

          receipt = {
              "format": "beforebuild-owner-receipts-v0.1",
              "receipts": [{
                  "case_id": "psfh-account-free-guestbook",
                  "candidate_id": "remark42",
                  "executed": True,
                  "hard_case_results": results,
                  "source": "loopback-ci:ghcr.io/umputun/remark42:v1.16.4@sha256:980e0e76a6f241cd181f44c5b4d686f0d8cd7f552e11deb3bdcba223b2c3b866",
              }],
          }
          json.dump(receipt, open("/tmp/remark-receipt.json", "w"), indent=2)
          json.dump({"hard_case_results": results, "notes": notes}, open("/tmp/remark-probe.json", "w"), indent=2)
          print(json.dumps({"hard_case_results": results, "notes": notes}, indent=2))
          PY

      - name: Evaluate prospective decision from actual owner trial
        run: |
          python experiments/beforebuild-v0/beforebuild.py             experiments/beforebuild-v0/prospective_guestbook.json             --receipt /tmp/remark-receipt.json             --out /tmp/guestbook-owner-result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/guestbook-owner-result.json'))
          row=r['results'][0]
          print(json.dumps({
              'prospective_verdict': row['verdict'],
              'reason': row['reason'],
              'candidate_coverage': row['candidate_coverage'],
          }, indent=2))
          PY

      - name: Preserve owner trial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beforebuild-remark42-owner-trial
          path: |
            /tmp/remark-probe.json
            /tmp/remark-receipt.json
            /tmp/guestbook-owner-result.json
          if-no-files-found: warn
          retention-days: 14
