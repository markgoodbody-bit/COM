name: PSFH D078 publish coherent illustrated-essay entrance

on:
  push:
    branches:
      - framework/psfh-d078-publish-20260923
    paths:
      - 'public/changes.md'
      - 'public/changes.html'
      - 'scripts/site-edition.mjs'
      - 'scripts/test-discovery.mjs'
      - 'app/globals.css'
      - 'app/page.tsx'
      - 'public/journey.js'
      - 'scripts/test-primary-routes.mjs'
      - '.github/workflows/psfh-maintained-ci.yml'
      - '.github/workflows/psfh-d078-publish.yml'

permissions:
  contents: write

jobs:
  publish-d078:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framework/psfh-d078-publish-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Pin D078 history and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          p=Path('public/manifest.json')
          m=json.loads(p.read_text())
          m['site_edition']='0.8.35'
          m['updated']='2026-09-23'
          m['provenance']['change_history_sha256']=sha('public/changes.md')
          m['provenance']['change_history_input_html_sha256']=sha('public/changes.html')
          note=m['provenance'].get('change_history_addendum_note','')
          m['provenance']['change_history_addendum_note']=note.replace('D045-D077','D045-D078')
          m['provenance']['human_essay_d078']={
            'source_pr':'https://github.com/markgoodbody-bit/COM/pull/449',
            'scope':'Combined illustrated-essay entrance: bounded reading column, optional alternate chooser, direct futures and early AI routes, Human Record moved to neighbours, duplicate copy removed, and route/journey checks promoted into maintained CI. D077 hero/title geometry preserved. No framework, machine-payload, crawler, intake or permission change. Reader benefit unmeasured.'
          }
          p.write_text(json.dumps(m, indent=2)+'\n')
          print('D078_CHANGES_MD_SHA256='+sha('public/changes.md'))
          print('D078_CHANGES_HTML_SHA256='+sha('public/changes.html'))
          PY
      - name: Build and check
        run: |
          npm run build
          node --test scripts/test-resources.mjs scripts/test-discovery.mjs scripts/test-primary-routes.mjs
          node --check public/journey.js
          python -m unittest scripts.test_import_resources scripts.test_source_views
          python scripts/check-local-links.py
          python scripts/check-visible-routes.py
          git diff --check
      - name: Commit exact D078 manifest pins
        run: |
          git config user.name "PSFH D078 publisher"
          git config user.email "actions@users.noreply.github.com"
          git add public/manifest.json
          if git diff --cached --quiet; then
            echo "No D078 manifest pin delta" >&2
            exit 1
          fi
          git commit -m "PSFH D078: pin illustrated-essay release provenance"
          git push origin HEAD:framework/psfh-d078-publish-20260923
      - name: Verify publication base
        env:
          EXPECTED_GH_PAGES: decc05063ec0a79da9a49260cfc7a32029bfab3f
        run: |
          git fetch origin gh-pages
          actual="$(git rev-parse origin/gh-pages)"
          test "$actual" = "$EXPECTED_GH_PAGES" || {
            echo "gh-pages moved: expected $EXPECTED_GH_PAGES, got $actual" >&2
            exit 1
          }
      - name: Stage exact built site over D077
        run: |
          rm -rf /tmp/psfh-d078-publish
          git worktree add -B gh-pages /tmp/psfh-d078-publish origin/gh-pages
          cname_blob="$(git -C /tmp/psfh-d078-publish hash-object CNAME)"
          nojekyll_blob="$(git -C /tmp/psfh-d078-publish hash-object .nojekyll)"
          attrs_blob="$(git -C /tmp/psfh-d078-publish hash-object .gitattributes)"
          readme_blob="$(git -C /tmp/psfh-d078-publish hash-object README.md)"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='CNAME' \
            --exclude='.nojekyll' \
            --exclude='.gitattributes' \
            --exclude='/README.md' \
            out/ /tmp/psfh-d078-publish/
          test "$(git -C /tmp/psfh-d078-publish hash-object CNAME)" = "$cname_blob"
          test "$(git -C /tmp/psfh-d078-publish hash-object .nojekyll)" = "$nojekyll_blob"
          test "$(git -C /tmp/psfh-d078-publish hash-object .gitattributes)" = "$attrs_blob"
          test "$(git -C /tmp/psfh-d078-publish hash-object README.md)" = "$readme_blob"
          node --input-type=module -e "import {verifyResources} from './scripts/resources.mjs'; await verifyResources('/tmp/psfh-d078-publish/resources');"
          git -C /tmp/psfh-d078-publish status --short
      - name: Commit and publish D078
        run: |
          git -C /tmp/psfh-d078-publish config user.name "PSFH release publisher"
          git -C /tmp/psfh-d078-publish config user.email "actions@users.noreply.github.com"
          git -C /tmp/psfh-d078-publish add -A
          if git -C /tmp/psfh-d078-publish diff --cached --quiet; then
            echo "No D078 publication delta" >&2
            exit 1
          fi
          git -C /tmp/psfh-d078-publish commit -m "Publish PSFH D078 coherent illustrated-essay entrance"
          git -C /tmp/psfh-d078-publish push origin HEAD:gh-pages
      - name: Verify D078 served root
        run: |
          expected="$(sha256sum out/index.html | awk '{print $1}')"
          ok=0
          for i in $(seq 1 18); do
            if curl -fsSL --max-time 20 https://pleasestartfromhere.com/ -o /tmp/psfh-live-index.html; then
              actual="$(sha256sum /tmp/psfh-live-index.html | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1 || {
            echo "Live root did not converge to D078 built bytes" >&2
            exit 1
          }
          curl -fsSL --max-time 20 https://pleasestartfromhere.com/changes.html -o /tmp/psfh-live-changes.html
          curl -fsSL --max-time 20 https://pleasestartfromhere.com/style.css -o /tmp/psfh-live-style.css
          grep -F 'Turn the post-story entrance into one coherent illustrated essay.' /tmp/psfh-live-changes.html
          grep -F 'Other ways in' /tmp/psfh-live-index.html
          grep -F 'Reading as an AI?' /tmp/psfh-live-index.html
          grep -F 'Explore something I want to make or change' /tmp/psfh-live-index.html
          grep -F 'width: min(calc(100% - 2.5rem), 42rem)' /tmp/psfh-live-style.css
          grep -F 'font-size: 1.25rem' /tmp/psfh-live-style.css
          grep -F 'font-size: clamp(3.75rem, 7vw, 7.5rem)' /tmp/psfh-live-style.css
          python - <<'PY'
          from pathlib import Path
          html=Path('/tmp/psfh-live-index.html').read_text()
          assert html.index('COM</a> holds project coordination') < html.index('The Human Record</a> is a separate public project')
          assert html.index('The Human Record</a> is a separate public project') > html.index('id="reading"')
          PY
          echo "D078 live root SHA-256: $expected"

# SOURCE_CI_GREEN != READER_BENEFIT
# PUSH_SUCCEEDED != LIVE_BYTES_VERIFIED
# EXPECTED_GH_PAGES_MISMATCH -> FAIL_CLOSED
