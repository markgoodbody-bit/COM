name: No Free QALY v0

on:
  pull_request:
    paths:
      - 'competition/no_free_qaly/**'
      - '.github/workflows/no-free-qaly.yml'
  push:
    branches:
      - 'framework/no-free-qaly-v0'
    paths:
      - 'competition/no_free_qaly/**'
      - '.github/workflows/no-free-qaly.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile competition/no_free_qaly/benchmark.py competition/no_free_qaly/test_benchmark.py
      - name: Unit tests
        run: python -m unittest competition/no_free_qaly/test_benchmark.py -v
      - name: Exact report smoke
        run: |
          python competition/no_free_qaly/benchmark.py competition/no_free_qaly/cases.json --out /tmp/report.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/report.json'))
          assert r['status'] == 'TEACHING_APPENDIX_OWNER_THEORY_NOT_BENCHMARK'
          assert r['monetary_rank_reversal'] is True
          comp=r['monetary_order_comparison']
          assert comp['strict_rank_reversal'] is True
          assert comp['strict_reversal_pairs'] == ['money_problem_a::money_problem_b']
          assert comp['tie_vs_order_pairs'] == []
          assert 'decision_quality_score' not in r
          print(json.dumps({
              'monetary_rank_groups': r['monetary_rank_groups'],
              'strict_reversal_pairs': comp['strict_reversal_pairs'],
              'tie_vs_order_pairs': comp['tie_vs_order_pairs']
          }, indent=2))
          PY
