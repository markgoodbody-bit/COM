name: PSFH D086 publish map-first Explore

on:
  push:
    branches:
      - framework/psfh-d086-publish-20260925
    paths:
      - 'public/changes.md'
      - 'public/changes.html'
      - 'scripts/site-edition.mjs'
      - 'scripts/test-discovery.mjs'
      - 'scripts/human-map.mjs'
      - 'scripts/test-map-first-current.mjs'
      - '.github/workflows/psfh-d086-publish.yml'

permissions:
  contents: write

jobs:
  publish-d086:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framework/psfh-d086-publish-20260925
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Pin D086 history and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          p=Path('public/manifest.json')
          m=json.loads(p.read_text())
          m['site_edition']='0.8.43'
          m['updated']='2026-09-25'
          m['provenance']['change_history_sha256']=sha('public/changes.md')
          m['provenance']['change_history_input_html_sha256']=sha('public/changes.html')
          note=m['provenance'].get('change_history_addendum_note','')
          m['provenance']['change_history_addendum_note']=note.replace('D045-D085','D045-D086')
          m['provenance']['map_first_explore_d086']={
            'source_pr':'https://github.com/markgoodbody-bit/COM/pull/490',
            'basis':'3f462ded684b1790c0df272569c29847831acccd',
            'candidate_head':'067911c7658bf9f9dfcbd23345ff8cfba2c77e0c',
            'scope':'Explore now presents its existing ten-question map immediately after the complete Anna Atkins artwork entrance, while preserving the original six orientation sections verbatim under About this reading space. All ten questions, thirty authored connections, source routes and machine representations are unchanged. Exact-head maintained CI and fresh 1440px/390px built-page QA passed. No framework, artwork-byte, node-text, graph-semantic, permission, intake, tracking or server-behaviour change. Reader benefit unmeasured.'
          }
          p.write_text(json.dumps(m, indent=2)+'\n')
          print('D086_CHANGES_MD_SHA256='+sha('public/changes.md'))
          print('D086_CHANGES_HTML_SHA256='+sha('public/changes.html'))
          PY
      - name: Build and check
        run: |
          npm run build
          node --test scripts/test-resources.mjs scripts/test-discovery.mjs scripts/test-primary-routes.mjs scripts/test-opening-copy.mjs scripts/test-works-current.mjs scripts/test-contextual-art.mjs scripts/test-reading-rooms-current.mjs scripts/test-appeal-example-current.mjs scripts/test-map-first-current.mjs
          node --check public/journey.js
          python -m unittest scripts.test_import_resources scripts.test_source_views
          python scripts/check-local-links.py
          git diff --check
      - name: Commit exact D086 manifest pins
        run: |
          git config user.name "PSFH D086 publisher"
          git config user.email "actions@users.noreply.github.com"
          git add public/manifest.json
          if git diff --cached --quiet; then
            echo "No D086 manifest pin delta" >&2
            exit 1
          fi
          git commit -m "PSFH D086: pin map-first Explore release provenance"
          git push origin HEAD:framework/psfh-d086-publish-20260925
      - name: Verify publication base
        env:
          EXPECTED_GH_PAGES: e78c04f9668ad46f10c20909fffb9f6def2dda9e
        run: |
          git fetch origin gh-pages
          actual="$(git rev-parse origin/gh-pages)"
          test "$actual" = "$EXPECTED_GH_PAGES" || {
            echo "gh-pages moved: expected $EXPECTED_GH_PAGES, got $actual" >&2
            exit 1
          }
      - name: Stage exact built site over D085
        run: |
          rm -rf /tmp/psfh-d086-publish
          git worktree add -B gh-pages /tmp/psfh-d086-publish origin/gh-pages
          cname_blob="$(git -C /tmp/psfh-d086-publish hash-object CNAME)"
          nojekyll_blob="$(git -C /tmp/psfh-d086-publish hash-object .nojekyll)"
          attrs_blob="$(git -C /tmp/psfh-d086-publish hash-object .gitattributes)"
          readme_blob="$(git -C /tmp/psfh-d086-publish hash-object README.md)"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='CNAME' \
            --exclude='.nojekyll' \
            --exclude='.gitattributes' \
            --exclude='/README.md' \
            out/ /tmp/psfh-d086-publish/
          test "$(git -C /tmp/psfh-d086-publish hash-object CNAME)" = "$cname_blob"
          test "$(git -C /tmp/psfh-d086-publish hash-object .nojekyll)" = "$nojekyll_blob"
          test "$(git -C /tmp/psfh-d086-publish hash-object .gitattributes)" = "$attrs_blob"
          test "$(git -C /tmp/psfh-d086-publish hash-object README.md)" = "$readme_blob"
          node --input-type=module -e "import {verifyResources} from './scripts/resources.mjs'; await verifyResources('/tmp/psfh-d086-publish/resources');"
          git -C /tmp/psfh-d086-publish status --short
      - name: Commit and publish D086
        run: |
          git -C /tmp/psfh-d086-publish config user.name "PSFH release publisher"
          git -C /tmp/psfh-d086-publish config user.email "actions@users.noreply.github.com"
          git -C /tmp/psfh-d086-publish add -A
          if git -C /tmp/psfh-d086-publish diff --cached --quiet; then
            echo "No D086 publication delta" >&2
            exit 1
          fi
          git -C /tmp/psfh-d086-publish commit -m "Publish PSFH D086 map-first Explore"
          git -C /tmp/psfh-d086-publish push origin HEAD:gh-pages
      - name: Verify D086 served bytes
        run: |
          ok=0
          for i in $(seq 1 18); do
            if curl -fsSL --max-time 20 https://pleasestartfromhere.com/manifest.json -o /tmp/psfh-live-manifest.json && grep -F '"site_edition": "0.8.43"' /tmp/psfh-live-manifest.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo "Live manifest did not converge to D086" >&2; exit 1; }
          curl -fsSL --max-time 20 https://pleasestartfromhere.com/explore/ -o /tmp/psfh-live-explore.html
          curl -fsSL --max-time 20 https://pleasestartfromhere.com/changes.html -o /tmp/psfh-live-changes.html
          grep -F '<section class="art-room art-room-atkins"' /tmp/psfh-live-explore.html
          grep -F 'What are you trying to understand, change, or keep possible? Begin with a question below.' /tmp/psfh-live-explore.html
          grep -F 'id="reading-map-title">Ten questions' /tmp/psfh-live-explore.html
          grep -F '<summary>About this reading space</summary>' /tmp/psfh-live-explore.html
          test "$(grep -o 'data-reading-node=' /tmp/psfh-live-explore.html | wc -l)" -eq 10
          test "$(grep -o 'data-relation=' /tmp/psfh-live-explore.html | wc -l)" -eq 30
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/psfh-live-explore.html').read_text()
          assert s.index('id="reading-map-title"') < s.index('<summary>About this reading space</summary>')
          assert s.index('art-room-atkins') < s.index('<main id="reading">')
          print('D086 order verification PASS')
          PY
          grep -F 'D086' /tmp/psfh-live-changes.html
          grep -F 'Put the Explore question map before the orientation.' /tmp/psfh-live-changes.html
          echo "D086 selected live-byte verification PASS"

# SOURCE_CI_GREEN != READER_BENEFIT
# PUSH_SUCCEEDED != LIVE_BYTES_VERIFIED
# EXPECTED_GH_PAGES_MISMATCH -> FAIL_CLOSED
