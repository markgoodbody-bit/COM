name: PSFH D082 publish reading rooms

on:
  push:
    branches:
      - framework/psfh-d082-publish-20260923
    paths:
      - '.github/workflows/psfh-d082-publish.yml'

permissions:
  contents: write

jobs:
  publish-d082:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framework/psfh-d082-publish-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Build and check D082
        run: |
          npm run build
          node --test scripts/test-resources.mjs scripts/test-discovery.mjs scripts/test-primary-routes.mjs scripts/test-opening-copy.mjs scripts/test-works-current.mjs scripts/test-contextual-art.mjs scripts/test-reading-rooms-current.mjs
          node --check public/journey.js
          python -m unittest scripts.test_import_resources scripts.test_source_views
          python scripts/check-local-links.py
          python scripts/check-visible-routes.py
          git diff --check
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const manifest=JSON.parse(await readFile('out/manifest.json','utf8'));
          if(manifest.site_edition!=='0.8.39') throw Error('D082 site edition missing');
          if(!manifest.provenance?.reading_room_shell_d082) throw Error('D082 provenance missing');
          for (const path of ['change','care','wisdom','selection','power','correction']) {
            const html=await readFile('out/explore/nodes/'+path+'.html','utf8');
            if(!html.includes('class="reading-room"')) throw Error('text-only shell missing: '+path);
            if(/<img\b/.test(html)) throw Error('text-only room acquired art: '+path);
            if(/style="/.test(html)) throw Error('inline reading-room style survived: '+path);
          }
          for (const path of ['aperture','significance','hardening','futures']) {
            const html=await readFile('out/explore/nodes/'+path+'.html','utf8');
            if(!html.includes('class="reading-room contextual-room"')) throw Error('art-bearing reading shell missing: '+path);
          }
          NODE
      - name: Verify publication base
        env:
          EXPECTED_GH_PAGES: 2c8de6e793d6d9610022d93cf1d5e8028a111712
        run: |
          git fetch origin gh-pages
          actual="$(git rev-parse origin/gh-pages)"
          test "$actual" = "$EXPECTED_GH_PAGES" || {
            echo "gh-pages moved: expected $EXPECTED_GH_PAGES, got $actual" >&2
            exit 1
          }
      - name: Stage exact built site over D081
        run: |
          rm -rf /tmp/psfh-d082-publish
          git worktree add -B gh-pages /tmp/psfh-d082-publish origin/gh-pages
          cname_blob="$(git -C /tmp/psfh-d082-publish hash-object CNAME)"
          nojekyll_blob="$(git -C /tmp/psfh-d082-publish hash-object .nojekyll)"
          attrs_blob="$(git -C /tmp/psfh-d082-publish hash-object .gitattributes)"
          readme_blob="$(git -C /tmp/psfh-d082-publish hash-object README.md)"
          rsync -a --delete --exclude='.git' --exclude='CNAME' --exclude='.nojekyll' --exclude='.gitattributes' --exclude='/README.md' out/ /tmp/psfh-d082-publish/
          test "$(git -C /tmp/psfh-d082-publish hash-object CNAME)" = "$cname_blob"
          test "$(git -C /tmp/psfh-d082-publish hash-object .nojekyll)" = "$nojekyll_blob"
          test "$(git -C /tmp/psfh-d082-publish hash-object .gitattributes)" = "$attrs_blob"
          test "$(git -C /tmp/psfh-d082-publish hash-object README.md)" = "$readme_blob"
          node --input-type=module -e "import {verifyResources} from './scripts/resources.mjs'; await verifyResources('/tmp/psfh-d082-publish/resources');"
      - name: Commit and publish D082
        run: |
          git -C /tmp/psfh-d082-publish config user.name "PSFH release publisher"
          git -C /tmp/psfh-d082-publish config user.email "actions@users.noreply.github.com"
          git -C /tmp/psfh-d082-publish add -A
          if git -C /tmp/psfh-d082-publish diff --cached --quiet; then
            echo "No D082 publication delta" >&2
            exit 1
          fi
          git -C /tmp/psfh-d082-publish commit -m "Publish PSFH D082 reading-room shell"
          git -C /tmp/psfh-d082-publish push origin HEAD:gh-pages
      - name: Verify D082 served bytes
        run: |
          declare -A paths=(
            [style]="style.css"
            [change]="explore/nodes/change.html"
            [wisdom]="explore/nodes/wisdom.html"
            [power]="explore/nodes/power.html"
            [correction]="explore/nodes/correction.html"
            [aperture]="explore/nodes/aperture.html"
            [manifest]="manifest.json"
            [changes]="changes.html"
          )
          ok=0
          for i in $(seq 1 18); do
            all=1
            for key in "${!paths[@]}"; do
              path="${paths[$key]}"
              expected="$(sha256sum "out/$path" | awk '{print $1}')"
              if ! curl -fsSL --max-time 20 "https://pleasestartfromhere.com/$path" -o "/tmp/psfh-d082-$key"; then all=0; continue; fi
              actual="$(sha256sum "/tmp/psfh-d082-$key" | awk '{print $1}')"
              test "$actual" = "$expected" || all=0
            done
            if [ "$all" = 1 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1 || { echo "Live D082 selected bytes did not converge" >&2; exit 1; }
          grep -F 'body.reading-room { max-width: none; padding: 0; }' /tmp/psfh-d082-style
          grep -F 'class="reading-room"' /tmp/psfh-d082-change
          grep -F 'class="reading-room contextual-room"' /tmp/psfh-d082-aperture
          ! grep -F 'style="' /tmp/psfh-d082-change
          grep -F '"site_edition": "0.8.39"' /tmp/psfh-d082-manifest
          grep -F 'Give the reading rooms one quiet text surface' /tmp/psfh-d082-changes
          echo "D082 selected live bytes verified"
