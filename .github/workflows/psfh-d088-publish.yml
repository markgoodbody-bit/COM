name: PSFH D088 publish encounter-evidence boundary

on:
  push:
    branches:
      - framework/psfh-d088-publish-20260927
    paths:
      - 'public/changes.md'
      - 'public/changes.html'
      - 'scripts/site-edition.mjs'
      - 'scripts/test-discovery.mjs'
      - 'public/explore/nodes/selection.html'
      - 'public/explore/nodes/selection.md'
      - 'public/explore/nodes/selection.json'
      - '.github/workflows/psfh-d088-publish.yml'

permissions:
  contents: write

jobs:
  publish-d088:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framework/psfh-d088-publish-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Pin D088 history and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          p=Path('public/manifest.json')
          m=json.loads(p.read_text())
          m['site_edition']='0.8.45'
          m['updated']='2026-09-27'
          m['provenance']['change_history_sha256']=sha('public/changes.md')
          m['provenance']['change_history_input_html_sha256']=sha('public/changes.html')
          note=m['provenance'].get('change_history_addendum_note','')
          for old in ('D045-D086','D045-D087'):
              note=note.replace(old,'D045-D088')
          m['provenance']['change_history_addendum_note']=note
          m['provenance']['encounter_evidence_d088']={
            'source_pr':'https://github.com/markgoodbody-bit/COM/pull/621',
            'basis':'f9f4a5c79e5636da7f139980d995a973e1815f97',
            'candidate_head':'3b4a0bf0b07da258da2d7d6839a4b48dc6087cd2',
            'external_return_coordination':'https://github.com/markgoodbody-bit/COM/issues/76#issuecomment-5854977592',
            'scope':'Selection now separates sender-side publication activity from evidence of external encounter: a receiving-side trace can support an encounter claim, silence does not prove non-reading, and one trace does not establish broader reach. Markdown/JSON/HTML carriers are synchronized and regression-pinned. No graph relation, tracking, analytics, TRACE/ME/THR source, permission, intake or server-behaviour change. Reader benefit beyond the concrete external correction remains unmeasured.'
          }
          p.write_text(json.dumps(m, indent=2)+'\n')
          print('D088_CHANGES_MD_SHA256='+sha('public/changes.md'))
          print('D088_CHANGES_HTML_SHA256='+sha('public/changes.html'))
          PY
      - name: Build and check
        run: |
          npm run build
          node --test scripts/test-resources.mjs scripts/test-discovery.mjs scripts/test-primary-routes.mjs scripts/test-opening-copy.mjs scripts/test-works-current.mjs scripts/test-contextual-art.mjs scripts/test-reading-rooms-current.mjs scripts/test-appeal-example-current.mjs scripts/test-map-first-current.mjs
          node --check public/journey.js
          python -m unittest scripts.test_import_resources scripts.test_source_views
          python scripts/check-local-links.py
          git diff --check
      - name: Commit exact D088 manifest pins
        run: |
          git config user.name "PSFH D088 publisher"
          git config user.email "actions@users.noreply.github.com"
          git add public/manifest.json
          if git diff --cached --quiet; then
            echo "No D088 manifest pin delta" >&2
            exit 1
          fi
          git commit -m "PSFH D088: pin current-source route release provenance"
          git push origin HEAD:framework/psfh-d088-publish-20260927
      - name: Verify publication base
        env:
          EXPECTED_GH_PAGES: 723b07f719adacbca14cd81c61a54bcbf0c58a41
        run: |
          git fetch origin gh-pages
          actual="$(git rev-parse origin/gh-pages)"
          test "$actual" = "$EXPECTED_GH_PAGES" || {
            echo "gh-pages moved: expected $EXPECTED_GH_PAGES, got $actual" >&2
            exit 1
          }
      - name: Stage exact built site over D087
        run: |
          rm -rf /tmp/psfh-d088-publish
          git worktree add -B gh-pages /tmp/psfh-d088-publish origin/gh-pages
          cname_blob="$(git -C /tmp/psfh-d088-publish hash-object CNAME)"
          nojekyll_blob="$(git -C /tmp/psfh-d088-publish hash-object .nojekyll)"
          attrs_blob="$(git -C /tmp/psfh-d088-publish hash-object .gitattributes)"
          readme_blob="$(git -C /tmp/psfh-d088-publish hash-object README.md)"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='CNAME' \
            --exclude='.nojekyll' \
            --exclude='.gitattributes' \
            --exclude='/README.md' \
            out/ /tmp/psfh-d088-publish/
          test "$(git -C /tmp/psfh-d088-publish hash-object CNAME)" = "$cname_blob"
          test "$(git -C /tmp/psfh-d088-publish hash-object .nojekyll)" = "$nojekyll_blob"
          test "$(git -C /tmp/psfh-d088-publish hash-object .gitattributes)" = "$attrs_blob"
          test "$(git -C /tmp/psfh-d088-publish hash-object README.md)" = "$readme_blob"
          node --input-type=module -e "import {verifyResources} from './scripts/resources.mjs'; await verifyResources('/tmp/psfh-d088-publish/resources');"
          git -C /tmp/psfh-d088-publish status --short
      - name: Commit and publish D088
        run: |
          git -C /tmp/psfh-d088-publish config user.name "PSFH release publisher"
          git -C /tmp/psfh-d088-publish config user.email "actions@users.noreply.github.com"
          git -C /tmp/psfh-d088-publish add -A
          if git -C /tmp/psfh-d088-publish diff --cached --quiet; then
            echo "No D088 publication delta" >&2
            exit 1
          fi
          git -C /tmp/psfh-d088-publish commit -m "Publish PSFH D088 encounter-evidence boundary"
          git -C /tmp/psfh-d088-publish push origin HEAD:gh-pages
      - name: Verify D088 served bytes
        run: |
          ok=0
          for i in $(seq 1 18); do
            if curl -fsSL --max-time 20 https://pleasestartfromhere.com/manifest.json -o /tmp/psfh-live-manifest.json && grep -F '"site_edition": "0.8.45"' /tmp/psfh-live-manifest.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo "Live manifest did not converge to D088" >&2; exit 1; }
          curl -fsSL --max-time 20 https://pleasestartfromhere.com/explore/nodes/selection.html -o /tmp/psfh-live-selection.html
          curl -fsSL --max-time 20 https://pleasestartfromhere.com/explore/nodes/selection.md -o /tmp/psfh-live-selection.md
          curl -fsSL --max-time 20 https://pleasestartfromhere.com/explore/nodes/selection.json -o /tmp/psfh-live-selection.json
          curl -fsSL --max-time 20 https://pleasestartfromhere.com/changes.html -o /tmp/psfh-live-changes.html

          for f in /tmp/psfh-live-selection.html /tmp/psfh-live-selection.md /tmp/psfh-live-selection.json; do
            grep -F 'sender-side activity, not by itself an external encounter' "$f"
            grep -F 'silence does not prove non-reading' "$f"
            grep -F 'one trace does not establish reach beyond that encounter' "$f"
          done

          grep -F 'D088' /tmp/psfh-live-changes.html
          grep -F 'Separate sender activity from evidence of encounter.' /tmp/psfh-live-changes.html
          echo "D088 selected live-byte verification PASS"

# SOURCE_CI_GREEN != READER_BENEFIT
# SENDER_ACTIVITY != EXTERNAL_ENCOUNTER_EVIDENCE
# NO_RECEIVING_TRACE != NO_ENCOUNTER
# ONE_TRACE != POPULATION_REACH
# PUSH_SUCCEEDED != LIVE_BYTES_VERIFIED
# EXPECTED_GH_PAGES_MISMATCH -> FAIL_CLOSED
