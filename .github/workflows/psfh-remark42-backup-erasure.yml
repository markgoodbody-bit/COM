name: PSFH Remark42 backup erasure probe

on:
  push:
    branches:
      - framework/psfh-remark42-backup-erasure-probe-20260918
    paths:
      - 'experiments/psfh-remark42-backup-erasure-20260918/**'
      - '.github/workflows/psfh-remark42-backup-erasure.yml'
  pull_request:
    paths:
      - 'experiments/psfh-remark42-backup-erasure-20260918/**'
      - '.github/workflows/psfh-remark42-backup-erasure.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile experiments/psfh-remark42-backup-erasure-20260918/probe.py
      - name: Container ownership regression
        run: python -m unittest discover -s experiments/psfh-remark42-backup-erasure-20260918 -p 'test_*.py'
      - name: Run synthetic owner lifecycle
        run: |
          python experiments/psfh-remark42-backup-erasure-20260918/probe.py --out /tmp/remark42-erasure-result.json
      - name: Preserve result
        uses: actions/upload-artifact@v4
        with:
          name: psfh-remark42-backup-erasure-result
          path: /tmp/remark42-erasure-result.json
          retention-days: 14
