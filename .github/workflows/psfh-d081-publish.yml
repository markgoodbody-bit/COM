name: PSFH D081 publish Explore art rooms

on:
  push:
    branches:
      - framework/psfh-d081-publish-20260923
    paths:
      - '.github/workflows/psfh-d081-publish.yml'

permissions:
  contents: write

jobs:
  publish-d081:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framework/psfh-d081-publish-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Build and check D081
        run: |
          npm run build
          node --test scripts/test-resources.mjs scripts/test-discovery.mjs scripts/test-primary-routes.mjs scripts/test-opening-copy.mjs scripts/test-works-current.mjs scripts/test-contextual-art.mjs
          node --check public/journey.js
          python -m unittest scripts.test_import_resources scripts.test_source_views
          python scripts/check-local-links.py
          python scripts/check-visible-routes.py
          git diff --check
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const manifest=JSON.parse(await readFile('out/manifest.json','utf8'));
          if(manifest.site_edition!=='0.8.38') throw Error('D081 site edition missing');
          if(!manifest.provenance?.contextual_art_rooms_d081) throw Error('D081 provenance missing');
          for (const path of ['explore/index.html','explore/nodes/futures.html','explore/nodes/aperture.html','explore/nodes/significance.html','explore/nodes/hardening.html']) {
            const html=await readFile('out/'+path,'utf8');
            if(!(html.indexOf('class="room-stage') < html.indexOf('class="room-credit"') &&
                 html.indexOf('class="room-credit"') < html.indexOf('class="room-heading"') &&
                 html.indexOf('class="room-heading"') < html.indexOf('class="room-nav"'))) {
              throw Error('D081 handoff order missing: '+path);
            }
          }
          const hardening=await readFile('out/explore/nodes/hardening.html','utf8');
          if(/class="room-stage room-stage-pair" style=/.test(hardening)) throw Error('Lewis inline pair style survived');
          NODE
      - name: Verify publication base
        env:
          EXPECTED_GH_PAGES: 4ffb1aa71a93bc3785682280fa5a433f7426d1f9
        run: |
          git fetch origin gh-pages
          actual="$(git rev-parse origin/gh-pages)"
          test "$actual" = "$EXPECTED_GH_PAGES" || {
            echo "gh-pages moved: expected $EXPECTED_GH_PAGES, got $actual" >&2
            exit 1
          }
      - name: Stage exact built site over D080
        run: |
          rm -rf /tmp/psfh-d081-publish
          git worktree add -B gh-pages /tmp/psfh-d081-publish origin/gh-pages
          cname_blob="$(git -C /tmp/psfh-d081-publish hash-object CNAME)"
          nojekyll_blob="$(git -C /tmp/psfh-d081-publish hash-object .nojekyll)"
          attrs_blob="$(git -C /tmp/psfh-d081-publish hash-object .gitattributes)"
          readme_blob="$(git -C /tmp/psfh-d081-publish hash-object README.md)"
          rsync -a --delete --exclude='.git' --exclude='CNAME' --exclude='.nojekyll' --exclude='.gitattributes' --exclude='/README.md' out/ /tmp/psfh-d081-publish/
          test "$(git -C /tmp/psfh-d081-publish hash-object CNAME)" = "$cname_blob"
          test "$(git -C /tmp/psfh-d081-publish hash-object .nojekyll)" = "$nojekyll_blob"
          test "$(git -C /tmp/psfh-d081-publish hash-object .gitattributes)" = "$attrs_blob"
          test "$(git -C /tmp/psfh-d081-publish hash-object README.md)" = "$readme_blob"
          node --input-type=module -e "import {verifyResources} from './scripts/resources.mjs'; await verifyResources('/tmp/psfh-d081-publish/resources');"
          git -C /tmp/psfh-d081-publish status --short
      - name: Commit and publish D081
        run: |
          git -C /tmp/psfh-d081-publish config user.name "PSFH release publisher"
          git -C /tmp/psfh-d081-publish config user.email "actions@users.noreply.github.com"
          git -C /tmp/psfh-d081-publish add -A
          if git -C /tmp/psfh-d081-publish diff --cached --quiet; then
            echo "No D081 publication delta" >&2
            exit 1
          fi
          git -C /tmp/psfh-d081-publish commit -m "Publish PSFH D081 Explore art-room handoff"
          git -C /tmp/psfh-d081-publish push origin HEAD:gh-pages
      - name: Verify D081 served bytes
        run: |
          declare -A paths=(
            [style]="style.css"
            [explore]="explore/index.html"
            [futures]="explore/nodes/futures.html"
            [aperture]="explore/nodes/aperture.html"
            [significance]="explore/nodes/significance.html"
            [hardening]="explore/nodes/hardening.html"
            [manifest]="manifest.json"
            [changes]="changes.html"
          )
          ok=0
          for i in $(seq 1 18); do
            all=1
            for key in "${!paths[@]}"; do
              path="${paths[$key]}"
              expected="$(sha256sum "out/$path" | awk '{print $1}')"
              if ! curl -fsSL --max-time 20 "https://pleasestartfromhere.com/$path" -o "/tmp/psfh-d081-$key"; then all=0; continue; fi
              actual="$(sha256sum "/tmp/psfh-d081-$key" | awk '{print $1}')"
              test "$actual" = "$expected" || all=0
            done
            if [ "$all" = 1 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1 || { echo "Live D081 selected bytes did not converge" >&2; exit 1; }
          grep -F 'max-height: 82svh' /tmp/psfh-d081-style
          grep -F 'class="room-credit"' /tmp/psfh-d081-aperture
          grep -F 'class="room-stage room-stage-pair"' /tmp/psfh-d081-hardening
          ! grep -F 'class="room-stage room-stage-pair" style=' /tmp/psfh-d081-hardening
          grep -F '"site_edition": "0.8.38"' /tmp/psfh-d081-manifest
          grep -F 'Clean the handoff from artwork to reading' /tmp/psfh-d081-changes
          echo "D081 selected live bytes verified"
