name: bounded-adaptation-v0-fixtures

on:
  pull_request:
    paths:
      - 'research/BOUNDED_ADAPTATION_*'
      - 'research/validate_bounded_adaptation_v0_fixtures.py'
      - 'research/validate_bounded_adaptation_v0_clean_deletion_gate.py'
      - '.github/workflows/bounded-adaptation-v0-fixtures.yml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print exact bounded-adaptation contract identities
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name in [
              'BOUNDED_ADAPTATION_CYCLE_RECEIPT_SCHEMA_V0_20260902.json',
              'BOUNDED_ADAPTATION_PROFILE_V0_20260902.json',
              'BOUNDED_ADAPTATION_CONSTITUTION_V0_20260902.json',
          ]:
              p = Path('research') / name
              print(name, hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Validate bounded adaptation v0 fixtures
        run: python research/validate_bounded_adaptation_v0_fixtures.py
      - name: Validate clean deletion-gate refusal
        run: python research/validate_bounded_adaptation_v0_clean_deletion_gate.py
