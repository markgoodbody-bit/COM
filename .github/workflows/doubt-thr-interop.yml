name: THR Doubt interoperability

on:
  push:
    branches:
      - framework/doubt-thr-interop-20260918
    paths:
      - 'experiments/doubt-thr-interop-20260918/**'
      - '.github/workflows/doubt-thr-interop.yml'
  pull_request:
    paths:
      - 'experiments/doubt-thr-interop-20260918/**'
      - '.github/workflows/doubt-thr-interop.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate all THR interoperability maps with upstream Doubt
        uses: alsoleg89/doubt@647482d536e8c3fdda573699426b7dc5673f9905 # v0.8.0
        with:
          path: experiments/doubt-thr-interop-20260918
          require-maps: 'true'
