name: EvidenceWatch Retrospective No-Spend Pipeline

on:
  pull_request:
    paths:
      - 'research/evidencewatch_retrospective/**'
      - 'coordination/resources/EVIDENCEWATCH_RETROSPECTIVE_*.md'
      - '.github/workflows/evidencewatch-retrospective-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-spend-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout COM
        uses: actions/checkout@v4

      - name: Fetch only pinned public Brierley owner files
        run: |
          set -euo pipefail
          mkdir -p /tmp/brierley-owner
          BASE="https://raw.githubusercontent.com/preprinting-a-pandemic/preprint_changes/a07c570cf3be4481ba74c59ceee22e40f949990b/data"
          curl --fail --location --silent --show-error "$BASE/abstract_scoring.csv" -o /tmp/brierley-owner/abstract_scoring.csv
          curl --fail --location --silent --show-error "$BASE/all_pairs.tsv" -o /tmp/brierley-owner/all_pairs.tsv

          test "$(git hash-object /tmp/brierley-owner/abstract_scoring.csv)" = "da5d608019200a14b31c9d605df8e27ced2eaa21"
          test "$(git hash-object /tmp/brierley-owner/all_pairs.tsv)" = "3c26344ffc84ca43656477dd2229ac6530d4735f"
          echo "pinned owner file blobs verified"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks
        run: |
          python -m py_compile \
            research/evidencewatch_retrospective/verify_brierley_manifest.py \
            research/evidencewatch_retrospective/build_blinded_brierley_packet.py \
            research/evidencewatch_retrospective/score_trivial_baselines.py \
            research/evidencewatch_retrospective/score_brierley_unblinded.py
          node --check research/evidencewatch_retrospective/run_brierley_retrospective.mjs

      - name: Reconstruct frozen challenge objects from pinned owner data
        run: |
          set -euo pipefail
          MANIFEST="research/evidencewatch_retrospective/brierley_major_vs_nochange_manifest_v2.json"

          python research/evidencewatch_retrospective/verify_brierley_manifest.py \
            /tmp/brierley-owner/abstract_scoring.csv \
            /tmp/brierley-owner/all_pairs.tsv \
            "$MANIFEST"

          python research/evidencewatch_retrospective/build_blinded_brierley_packet.py \
            /tmp/brierley-owner/all_pairs.tsv \
            "$MANIFEST" \
            /tmp/brierley_packet.json \
            /tmp/brierley_key.json

          python research/evidencewatch_retrospective/score_trivial_baselines.py \
            /tmp/brierley-owner/all_pairs.tsv \
            "$MANIFEST" \
            /tmp/brierley_baselines.json

      - name: Assert frozen selection, blinding and lexical baseline
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          packet=json.load(open('/tmp/brierley_packet.json', encoding='utf-8'))
          key=json.load(open('/tmp/brierley_key.json', encoding='utf-8'))
          baseline=json.load(open('/tmp/brierley_baselines.json', encoding='utf-8'))

          assert packet['schema'] == 'evidencewatch-brierley-blinded-packet-v1'
          assert packet['status'] == 'BLINDED_INPUT_NO_OWNER_LABELS'
          assert packet['case_count'] == 44
          assert len(packet['cases']) == 44
          assert all(set(row) == {'case_id','preprint_abstract','published_abstract'} for row in packet['cases'])

          labels=Counter(row['owner_label'] for row in key['cases'])
          assert labels == {'ABSTRACT_MAJOR_CHANGE':22, 'ABSTRACT_NO_CHANGE':22}, labels

          assert baseline['missing_owner_published_abstracts'] == []

          expected={
            'token_set_jaccard_distance':0.7995867768595041,
            'token_multiset_jaccard_distance':0.7913223140495868,
            'token_count_delta':0.7871900826446281,
          }
          for name,want in expected.items():
              metric=baseline['metrics'][name]
              assert metric['complete_positive_n'] == 22
              assert metric['complete_control_n'] == 22
              assert metric['missing_positive_n'] == 0
              assert metric['missing_control_n'] == 0
              assert abs(metric['auc'] - want) < 1e-12, (name,metric['auc'],want)

          print('packet cases=',packet['case_count'])
          print('labels=',dict(labels))
          print('lexical complete cases=44')
          print('lexical baseline assertions PASS')
          PY

      - name: Harness fails closed before provider access when pinned private checkout is absent
        run: |
          set -euo pipefail
          set +e
          OUT="$(
            node research/evidencewatch_retrospective/run_brierley_retrospective.mjs \
              --evidencewatch /tmp/not-present-evidencewatch \
              --packet /tmp/brierley_packet.json \
              --output /tmp/should-not-exist.json \
              --ledger /tmp/should-not-exist.jsonl \
              2>&1
          )"
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          printf '%s\n' "$OUT" | grep -F 'EvidenceWatch checkout not found'
          test ! -e /tmp/should-not-exist.json
          test ! -e /tmp/should-not-exist.jsonl
          echo "harness fail-closed pre-provider gate PASS"

      - name: Build synthetic structural pre-unblind output
        run: |
          python - <<'PY'
          import json

          key=json.load(open('/tmp/brierley_key.json', encoding='utf-8'))
          first_positive=next(r['case_id'] for r in key['cases'] if r['owner_label']=='ABSTRACT_MAJOR_CHANGE')
          first_control=next(r['case_id'] for r in key['cases'] if r['owner_label']=='ABSTRACT_NO_CHANGE')

          cases=[]
          receipts=[]
          for row in key['cases']:
              cid=row['case_id']
              positive=row['owner_label']=='ABSTRACT_MAJOR_CHANGE'
              failed=cid in {first_positive, first_control}

              baseline={
                  'engine_status':'BASELINE_ESTABLISHED',
                  'source_id':f'{cid}-preprint',
                  'relation':'baseline',
                  'current_state':{'status':'supported','quantity':None},
                  'summary':'synthetic scorer-structure test',
                  'material_reasons':[],
                  'alert_kind':None,
                  'error':None,
                  'elapsed_ms':1,
              }

              if failed:
                  successor={
                      'engine_status':'ANALYSIS_FAILED',
                      'source_id':f'{cid}-publication',
                      'relation':None,
                      'current_state':None,
                      'summary':None,
                      'material_reasons':[],
                      'alert_kind':None,
                      'error':'synthetic failure for scorer contract test',
                      'elapsed_ms':1,
                  }
              elif positive:
                  successor={
                      'engine_status':'MATERIAL_DELTA',
                      'source_id':f'{cid}-publication',
                      'relation':'correction',
                      'current_state':{'status':'supported','quantity':None},
                      'summary':'synthetic positive',
                      'material_reasons':['synthetic_material_reason'],
                      'alert_kind':'correction',
                      'error':None,
                      'elapsed_ms':1,
                  }
              else:
                  successor={
                      'engine_status':'NO_MATERIAL_DELTA',
                      'source_id':f'{cid}-publication',
                      'relation':'baseline',
                      'current_state':{'status':'supported','quantity':None},
                      'summary':'synthetic control',
                      'material_reasons':[],
                      'alert_kind':None,
                      'error':None,
                      'elapsed_ms':1,
                  }

              cases.append({
                  'case_id':cid,
                  'baseline':baseline,
                  'successor':successor,
                  'prediction_review':successor['engine_status']=='MATERIAL_DELTA',
                  'final_canonical_state':successor.get('current_state'),
                  'alert_count':1 if successor['engine_status']=='MATERIAL_DELTA' else 0,
              })
              for phase in ('preprint','publication'):
                  receipts.append({
                      'case_id':cid,
                      'phase':phase,
                      'started_at':'2000-01-01T00:00:00.000Z',
                      'completed_at':'2000-01-01T00:00:01.000Z',
                      'http_status':200,
                      'ok':True,
                      'raw_response_body':'{"synthetic":true}',
                  })

          pre={
              'schema':'evidencewatch-brierley-pre-unblind-output-v1',
              'status':'OUTPUT_FROZEN_BEFORE_OWNER_LABEL_JOIN',
              'started_at':'2000-01-01T00:00:00.000Z',
              'completed_at':'2000-01-01T00:01:00.000Z',
              'evidencewatch':{'commit':'synthetic-contract-test'},
              'packet':{'sha256':'synthetic','case_count':44},
              'provider':{
                  'model':'synthetic-contract-test',
                  'endpoint':'none',
                  'expected_calls':88,
                  'observed_calls':88,
              },
              'common_claim':'synthetic scorer contract test',
              'cases':cases,
              'provider_receipts':receipts,
              'ledger_path':'synthetic',
          }
          json.dump(pre,open('/tmp/synthetic_pre_unblind.json','w',encoding='utf-8'),indent=2)
          print('synthetic failed positive=',first_positive)
          print('synthetic failed control=',first_control)
          PY

      - name: Exercise frozen unblinding scorer and conservative failure rule
        run: |
          python research/evidencewatch_retrospective/score_brierley_unblinded.py \
            /tmp/synthetic_pre_unblind.json \
            /tmp/brierley_key.json \
            /tmp/brierley_baselines.json \
            /tmp/synthetic_scored.json

          python - <<'PY'
          import json
          score=json.load(open('/tmp/synthetic_scored.json', encoding='utf-8'))
          strict=score['headline_strict_failure_worst_case']
          raw=score['raw_output_prediction']
          available=score['available_case_only']

          assert strict['tp'] == 21, strict
          assert strict['fn'] == 1, strict
          assert strict['fp'] == 1, strict
          assert strict['tn'] == 21, strict

          assert raw['tp'] == 21, raw
          assert raw['fn'] == 1, raw
          assert raw['fp'] == 0, raw
          assert raw['tn'] == 22, raw

          assert available['case_n'] == 42, available
          assert available['excluded_failure_n'] == 2, available
          assert score['failures']['total'] == 2

          for metric in score['trivial_lexical_baselines'].values():
              assert metric['best_at_or_below_model_strict_far'] is not None

          print('strict=',strict)
          print('raw=',raw)
          print('available=',available)
          print('unblinding scorer contract PASS')
          PY

      - name: Gate summary
        run: |
          echo "NO PROVIDER CREDENTIALS USED"
          echo "NO MODEL CALLS"
          echo "PRIVATE EVIDENCEWATCH EXACT-CHECKOUT DRY RUN REMAINS LOCAL"
          echo "EVIDENCEWATCH_RETROSPECTIVE_NO_SPEND_PIPELINE_OK"
