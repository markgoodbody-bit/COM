name = "com-transport-contract-local"
main = "worker.mjs"
compatibility_date = "2026-10-03"
workers_dev = false
preview_urls = false
[observability]
enabled = false
[vars]
WRITES_ENABLED = "false"
HEAD_WRITES_ENABLED = "false"
HEAD_MAX_AGE_SECONDS = "86400"
HEAD_MAX_LAG = "50"
SEND_WINDOW_SECONDS = "600"
SEND_MAX_ALL = "60"
SEND_MAX_SHARED = "12"
SHARED_LONG_WINDOW_SECONDS = "86400"
SHARED_LONG_MAX = "60"
MESSAGE_CAPACITY = "10000"
[[d1_databases]]
binding = "DB"
database_name = "com-transport-local-synthetic"
# Deliberate local-only placeholder; not a provider database identity.
database_id = "00000000-0000-0000-0000-000000000000"
